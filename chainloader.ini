[Chainloader]

; Booleans are read from the first character only: 1, y or Y is true, any
; other non-empty value is false, and a blank value keeps the key's default.

; Scan this directory for mod DLLs on startup.
; Relative to the game exe, or an absolute path.
; Default: mods
ScanPath=mods

; Also scan the game exe's own directory for loose DLLs.
; Most users won't need this. Default: 0
ScanGameDir=0

; Path to a Mewtator manifest file listing additional DLLs to load.
; Mewtator sets this automatically — leave empty if not using Mewtator.
; Can be relative (to game dir) or absolute.
MewtatorManifest=

; Set to 0 to disable the chainloader entirely without removing it.
; The version.dll proxy still forwards calls, but no mods are loaded.
; Default: 1
Enabled=1

; Write a log to mod_logs/chainloader.log. Useful for debugging.
; Set to 0 to disable this log entirely: no log file is created and no
; log output is produced. Crash reports under mod_logs/crashes are a
; separate concern and are still written.
; Default: 1
Logging=1

; Patch the game's PE entry point so mods load even if the game never calls a
; version.dll export. 0 skips the patch; mods then load on the first proxy
; call instead (if the game never calls one, no mods load).
; Blank = auto: on under Windows, off under Wine/Proton, where the patch can
; hang startup. 1 or 0 overrides.
; Default: blank
EnableEPFallback=

[LoadOrder]

; Force specific mods to load first, in the order listed here.
; Use Mod1, Mod2, Mod3, etc. — they load in numbered order before
; the normal directory scan picks up everything else.
;
; Names are relative to ScanPath, so with the default ScanPath=mods,
; "my_mod.dll" resolves to mods\my_mod.dll.
; Absolute paths also work (e.g. "C:\Games\Mods\my_mod.dll").
;
; Any DLLs in the scan directory that aren't listed here still load
; normally afterward. This just controls what goes first.
; List every mod for full control over the entire load order.
;
; Mewtator mod DLLs are loaded last, but fully obey their own load order.
;
; The numbers set relative order and nothing else. Gaps are fine, so
; commenting out one entry leaves the rest alone.
;
; An entry naming a DLL you don't have installed is skipped, and the
; log records it as "not installed". Listing a mod you haven't
; installed costs nothing and is not an error.
;
; A DLL already loaded under the same file name from another folder is
; skipped too ("already loaded from ..."). A mod listed here and also in
; the Mewtator manifest loads once.


; --- Framework entries, Mod1 to Mod9. Leave these in place. ---
;
; Mod1 is held for Mewjector's .NET bridge (mj_dotnet.dll, v4). Leave it
; unset until then.
;
; The rest pin the framework DLLs ahead of the mods that call into them.
; The plain directory scan can't do it on its own: it walks the folder
; in directory order, which on NTFS comes out alphabetical, and
; basic_custom_extensions.dll sorts ahead of csf_core.dll.
;
; csf_core.dll is the Custom Status Framework API. An extension that
; loads before it isn't broken, it just falls back to the deferred
; bind path and re-polls on a background timer until core turns up.
; Loading core first skips the wait and lets extensions bind during
; their own DllMain.
;
; Two cases where this line gets skipped, both harmless: you don't
; have CSF installed, or you installed it through Mewtator, which
; loads its mods in a later phase and orders them itself.
Mod2=csf_core.dll


; --- Your own entries, Mod10 and up ---
;
; Example:
;   Mod10=gameplay_tweaks.dll
;   Mod11=ui_overhaul.dll
